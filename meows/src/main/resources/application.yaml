### template yml ###
spring:
  application:
    name: meows

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    validate-on-migrate: true

  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: DEBUG

